<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tests</title></head>
<body>
  <h1>Tests</h1>
  <pre id="out"></pre>
  <script type="module">
    import { toMinutes, toText, plan, departures, liveTimes } from "./core.js";
    import { route } from "./route.js";

    const lines = [];
    function check(name, actual, expected) {
      const ok = actual === expected;
      lines.push(`${ok ? "PASS" : "FAIL"}  ${name}${ok ? "" : `  (got ${actual}, expected ${expected})`}`);
    }

    check("toMinutes", toMinutes("09:00"), 540);
    check("toText", toText(484), "08:04");

    // Sample route: bus at 08:35 is the latest that arrives by 09:00.
    // Train at 08:12 is the latest that connects. Leave at 08:04.
    const p = plan(route, toMinutes("09:00"), 10);
    check("busDeparture", toText(p.busDeparture), "08:35");
    check("trainDeparture", toText(p.trainDeparture), "08:12");
    check("leave", toText(p.leave), "08:04");
    check("notifyAt", toText(p.notifyAt), "07:54");
    check("arrive", toText(p.arrive), "08:55");
    check("arrive is on time", p.arrive <= toMinutes("09:00"), true);

    check("toText wraps below 0", toText(-5), "23:55");
    check("toText wraps above 1439", toText(1500), "01:00");

    let threw = false;
    try { plan({ ...route, bus: { ...route.bus, every: 0 } }, 540, 10); } catch (e) { threw = true; }
    check("every of 0 throws", threw, true);

    // The first bus can arrive by 06:30, but no train connects to it.
    check("bus but no train", plan(route, toMinutes("06:30"), 10), null);

    check("no trip before the first bus", plan(route, toMinutes("06:10"), 10), null);

    // Live data. The sample answer has two buses and one bus that already left.
    const answer = { services: [{ no: "15", next: { time: "2026-11-19T08:10:30+08:00", duration_ms: 1000 },
      subsequent: { time: "2026-11-19T08:20:00+08:00", duration_ms: 2000 },
      next2: { time: "2026-11-19T08:20:00+08:00", duration_ms: 2000 },
      next3: { time: "2026-11-19T08:01:00+08:00", duration_ms: -5 } }] };
    check("liveTimes count", liveTimes(answer, "15").length, 2);
    check("liveTimes first", toText(liveTimes(answer, "15")[0]), "08:10");
    check("liveTimes unknown service", liveTimes(answer, "99").length, 0);
    check("liveTimes bad answer", liveTimes(null, "15").length, 0);
    const liveBus = { ...route.bus, live: liveTimes(answer, "15") };
    check("live replaces the timetable", departures(liveBus).filter((x) => x <= 500).length, 2);
    check("timetable after live", departures(liveBus).includes(toMinutes("08:25")), true);
    const lp = plan({ ...route, bus: liveBus }, toMinutes("08:40"), 10);
    check("plan uses a live bus", toText(lp.busDeparture), "08:20");

    document.getElementById("out").textContent = lines.join("\n");
  </script>
</body>
</html>
